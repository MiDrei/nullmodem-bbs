name: nullmodem

# cmd/bbs, cmd/mailer, and cmd/web are three independent daemons built
# into the same image (see Dockerfile) and run as separate services
# here -- each restarts independently, and only the ones you actually
# want running need to be started (e.g. skip mailer if this system
# isn't on FidoNet/fsxNet). All three share the same configs/ and
# data/ bind mounts, exactly like three OS processes on a single host
# would (see cmd/mailer/main.go's own doc comment).
services:
  bbs:
    build: .
    image: nullmodem-bbs:latest
    command: ["./bin/bbs"]
    ports:
      - "2323:2323" # telnet
      - "2222:2222" # ssh
    volumes:
      - ./configs:/app/configs
      - nullmodem-data:/app/data
    restart: unless-stopped

  mailer:
    image: nullmodem-bbs:latest
    command: ["./bin/mailer"]
    ports:
      - "24554:24554" # inbound BinkP (see configs/bbs.yaml's binkp.listen_enabled)
    volumes:
      - ./configs:/app/configs
      - nullmodem-data:/app/data
    restart: unless-stopped

  web:
    image: nullmodem-bbs:latest
    command: ["./bin/web"]
    ports:
      - "8090:8090" # admin UI + REST API
    volumes:
      - ./configs:/app/configs
      - nullmodem-data:/app/data
    restart: unless-stopped

volumes:
  # SQLite database (WAL mode, safely shared across the three
  # services above -- see internal/db), SSH host key, uploaded files,
  # and any door installs (see docs/adding-a-door.md) all live here.
  nullmodem-data:
