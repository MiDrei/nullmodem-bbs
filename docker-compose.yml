name: nullmodem

# cmd/bbs, cmd/mailer, and cmd/web are three independent daemons built
# into the same image (see Dockerfile) and run as separate services
# here -- each restarts independently, and only the ones you actually
# want running need to be started (e.g. skip mailer if this system
# isn't on FidoNet/fsxNet).
#
# bbs.yaml/web.yaml are bind-mounted as individual files: real
# per-deployment runtime state (bbs.yaml is gitignored -- the web
# admin Settings page can write a live BinkP uplink password into it).
# configs/menus and configs/screens are bind-mounted as whole
# directories instead: they ship with defaults baked into the image,
# but are also runtime-editable (the web admin's ANSI Designer writes
# .ans files straight back into configs/screens -- see
# internal/web/screens_handler.go), so a sysop's customizations need
# to survive a container recreate/image update the same way data/
# does. docker-entrypoint.sh seeds these two directories from the
# image's own defaults on startup without ever overwriting a file
# that's already there, so an empty/fresh bind mount still gets a
# working set on first run, and a later image adding a new default
# screen doesn't clobber one a sysop already customized.
services:
  bbs:
    build: .
    image: nullmodem-bbs:latest
    command: ["./bin/bbs"]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC} # e.g. Europe/Zurich: logs, backup names, nightly runs
    ports:
      - "2323:2323" # telnet
      - "2222:2222" # ssh
    volumes:
      - ./configs/bbs.yaml:/app/configs/bbs.yaml
      - ./configs/menus:/app/configs/menus
      - ./configs/screens:/app/configs/screens
      - ./data:/app/data
    restart: unless-stopped

  mailer:
    image: nullmodem-bbs:latest
    command: ["./bin/mailer"]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC} # e.g. Europe/Zurich: logs, backup names, nightly runs
    ports:
      - "24554:24554" # inbound BinkP (see configs/bbs.yaml's binkp.listen_enabled)
    volumes:
      - ./configs/bbs.yaml:/app/configs/bbs.yaml
      - ./data:/app/data
    restart: unless-stopped

  web:
    image: nullmodem-bbs:latest
    command: ["./bin/web"]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC} # e.g. Europe/Zurich: logs, backup names, nightly runs
    ports:
      - "8090:8090" # admin UI + REST API
    volumes:
      - ./configs/bbs.yaml:/app/configs/bbs.yaml
      - ./configs/web.yaml:/app/configs/web.yaml
      - ./configs/menus:/app/configs/menus
      - ./configs/screens:/app/configs/screens
      - ./data:/app/data
    restart: unless-stopped

# data/ is a bind mount, not a named volume, so a sysop can manage its
# contents directly from the host -- installing a door (see
# docs/adding-a-door.md) is just copying files into ./data/doors/,
# no `docker cp`/`docker exec` needed. The container runs as root by
# default (see Dockerfile), so PUID/PGID above make it write those
# files (and seeded configs/menus, configs/screens) as your own host
# user instead of root -- set them in a .env file next to this one, or
# export before `docker compose up`:
#   echo "PUID=$(id -u)" >> .env
#   echo "PGID=$(id -g)" >> .env
