admin.binkp_uplinks.still_meaningful_when_crash_only: "Still meaningful when Crash-only is checked below: a slow fallback poll, since a crash-only uplink otherwise only gets dialed when there's actually mail to send."
admin.binkp_uplinks.this_is_one_of_our: "This is one of our own nodes/points (we're their hub) -- lists it under \"Nodes / Points\" instead of \"Hubs\". With a point address (21:3/194.1) it is treated as a point: it only gets netmail addressed to it and the areas it subscribed to."
admin.binkp_uplinks.crash_only_exclude_from_the: "Crash-only: exclude from the mailer's regular, interval-based scheduled poll -- still dialed immediately whenever there's netmail or echomail actually pending for it (see the mailer's crash-style triggering), plus the poll interval above as a slow fallback if set, or manually via \"Send Now\""
admin.binkp_uplinks.hold_never_dialed_automatically_for: "Hold: never dialed automatically for any reason at all, not even pending/Crash mail -- only via \"Send Now\", or by this uplink polling us itself. Use this for a peer that can't be reached back either way (e.g. a point behind NAT with no port forwarding), where Crash-only above still isn't enough to stop a doomed dial attempt every time there's mail pending for it."
admin.binkp_uplinks.no_cram_md5_send_the: "No CRAM-MD5: send the session password in the clear even when this uplink offers CRAM-MD5. Only for diagnosing a hub -- anyone on the path can read the password. Leave off otherwise."
admin.binkp_uplinks.restrict_to_these_of_your: "Restrict to these of your own addresses"
admin.binkp_uplinks.only_checked_addresses_are_presented: "Only checked addresses are presented to this uplink (M_ADR) and count as its own for Crash-mail routing -- keeps an AKA that belongs to a different network from leaking into a hub that has nothing to do with it (a hub's own software can auto-register a new node entry for every address it sees in M_ADR). Leave all unchecked to keep the old behavior: every address applies to every uplink."
