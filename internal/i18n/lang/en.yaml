# The door templates (internal/doors), found by their English text
doortpl.umrc.description: "Multi-Relay Chat: live chat with the callers of 180+ other BBSes, through uMRC."
doortpl.umrc.setup: "Its background program umrc-bridge keeps the connection to the chat network and runs as long as the door is set up (see Services). Only one such connection per board is allowed: don't run uMRC for the same board anywhere else."
doortpl.immortal_barons.description: "Build an empire and conquer your neighbours: a faithful remake of Barren Realms Elite, with inter-BBS leagues."
doortpl.immortal_barons.setup: "Installed with the default game settings. To change them later (turns per day and so on), run \"immortal-barons -reset -data data\" in the door's directory -- that also starts a new game."
doortpl.usurper_reborn.description: "The big modern Usurper: a persistent fantasy RPG with 60+ NPCs who live, marry and die on their own."
doortpl.usurper_reborn.setup: "A large download (about 55 MB). Players can also reach the game's public online server from its menu."
doortpl.usurper.description: "The 1993 original: dungeons, monsters, player combat, gods and marriages. Native Linux build of version 0.25."
doortpl.judge_dredd.description: "LORD-style RPG in Mega-City One: fight perps, level up your Judge, patrol the sectors."
doortpl.lord.description: "The best-known door game of all: slay the Red Dragon, flirt at the inn, fight other players."
doortpl.lord.license: "Get it yourself (v4.07)"
doortpl.lord.setup: "Unpack LORD into the door's directory, then once run LORDCFG from the \"DOS Shell (Doorway)\" door."
doortpl.tw2002.description: "Space trading and conquest across a galaxy of sectors, the multiplayer classic."
doortpl.tw2002.license: "Get it yourself (v3.x)"
doortpl.tw2002.setup: "Unpack TradeWars into the door's directory, then once run its setup (TEDIT/BIGBANG) from the \"DOS Shell (Doorway)\" door."
doortpl.oo2.description: "Post-apocalyptic survival RPG."
doortpl.oo2.license: "Get it yourself (v1.21)"
doortpl.oo2.setup: "Unpack OO2 into the door's directory, then once run its setup from the \"DOS Shell (Doorway)\" door."
doortpl.doormud.description: "A multi-user dungeon as a door: explore, fight and chat with everyone online."
doortpl.doormud.license: "Get it yourself (v0.99)"
doortpl.doormud.setup: "Unpack DoorMUD into the door's directory; \"DMUD.EXE -l\" from the \"DOS Shell (Doorway)\" door configures it."
