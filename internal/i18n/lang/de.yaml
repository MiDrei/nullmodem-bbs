admin.areafix.request_echomail_areafix_or_file_2: "Echomail- (Areafix) oder File-Echo-Bereiche (Filefix) bei einem eingerichteten Uplink bestellen. Jede Bestellung wird als Netmail mit Crash-Priorität eingereiht und innerhalb weniger Minuten über den üblichen Crash-Auslöser des Mailers gesendet, nicht sofort -- die Antwort (angenommen, abgelehnt oder ein Passwortfehler) kommt als gewöhnliche Netmail zurück. Die Bereichsliste eines Hubs in Kästchen umzuwandeln klappt nicht immer: jede Hub-Software formatiert sie anders, prüfen Sie also bei Ungereimtheiten den Rohtext der Antwort unten und tragen Sie fehlende Tags von Hand ein."
admin.areafix.a_downlink_authenticated_with_the: "Ein Downlink mit dem richtigen Areafix/Filefix-Passwort kann trotzdem nichts bestellen, was hier nicht angehakt ist -- geben Sie nur frei, was dieser Downlink wirklich bestellen soll. Ein Häkchen zu entfernen bestellt nichts ab, was schon freigegeben ist; der Bereich ist nur ab jetzt nicht mehr bestellbar."
