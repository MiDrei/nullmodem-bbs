# Die Door-Vorlagen
doortpl.umrc.description: "Multi-Relay Chat: Live-Chat mit den Anrufern von über 180 anderen BBS, über uMRC."
doortpl.umrc.setup: "Sein Hintergrundprogramm umrc-bridge hält die Verbindung zum Chat-Netz und läuft, solange die Door eingerichtet ist (siehe Dienste). Pro Board ist nur eine solche Verbindung erlaubt: lassen Sie uMRC für dasselbe Board nirgends sonst laufen."
doortpl.immortal_barons.description: "Bauen Sie ein Reich und erobern Sie Ihre Nachbarn: eine treue Neuauflage von Barren Realms Elite, mit Inter-BBS-Ligen."
doortpl.immortal_barons.setup: "Mit den Standard-Spieleinstellungen installiert. Um sie später zu ändern (Züge pro Tag usw.), im Verzeichnis der Door \"immortal-barons -reset -data data\" ausführen -- das startet auch ein neues Spiel."
doortpl.usurper_reborn.description: "Der grosse moderne Usurper: ein dauerhaftes Fantasy-Rollenspiel mit über 60 NPCs, die von selbst leben, heiraten und sterben."
doortpl.usurper_reborn.setup: "Ein grosser Download (etwa 55 MB). Spieler erreichen über sein Menü auch den öffentlichen Online-Server des Spiels."
doortpl.usurper.description: "Das Original von 1993: Verliese, Monster, Kämpfe zwischen Spielern, Götter und Hochzeiten. Native Linux-Version 0.25."
doortpl.judge_dredd.description: "Rollenspiel im Stil von LORD in Mega-City One: Verbrecher jagen, den eigenen Judge aufsteigen lassen, die Sektoren bestreifen."
doortpl.lord.description: "Das bekannteste Door-Spiel überhaupt: den Roten Drachen erschlagen, im Gasthaus flirten, gegen andere Spieler kämpfen."
doortpl.lord.license: "Selbst besorgen (v4.07)"
doortpl.lord.setup: "LORD ins Verzeichnis der Door entpacken, dann einmal LORDCFG aus der Door \"DOS Shell (Doorway)\" starten."
doortpl.tw2002.description: "Handel und Eroberung in einer Galaxie aus Sektoren, der Mehrspieler-Klassiker."
doortpl.tw2002.license: "Selbst besorgen (v3.x)"
doortpl.tw2002.setup: "TradeWars ins Verzeichnis der Door entpacken, dann einmal sein Setup (TEDIT/BIGBANG) aus der Door \"DOS Shell (Doorway)\" starten."
doortpl.oo2.description: "Überlebens-Rollenspiel nach der Apokalypse."
doortpl.oo2.license: "Selbst besorgen (v1.21)"
doortpl.oo2.setup: "OO2 ins Verzeichnis der Door entpacken, dann einmal sein Setup aus der Door \"DOS Shell (Doorway)\" starten."
doortpl.doormud.description: "Ein Mehrspieler-Dungeon als Door: erkunden, kämpfen und mit allen Online-Spielern plaudern."
doortpl.doormud.license: "Selbst besorgen (v0.99)"
doortpl.doormud.setup: "DoorMUD ins Verzeichnis der Door entpacken; \"DMUD.EXE -l\" aus der Door \"DOS Shell (Doorway)\" richtet es ein."
