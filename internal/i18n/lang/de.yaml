admin.backups.every_night_a_copy_of: "Jede Nacht eine Kopie der Datenbank, der Konfiguration (bbs.yaml, web.yaml, Menüs und Screens) und der Schlüssel (Login-Geheimnis, SSH-Hostschlüssel, Push-Schlüssel) -- erstellt, während die BBS weiterläuft. Zum Wiederherstellen packt man eines ins Verzeichnis der BBS aus; siehe docs/backup.de.md."
