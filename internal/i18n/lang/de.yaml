admin.binkp_uplinks.locally_posted_echomail_in_this: "Hier geschriebene Echomail in den Bereichen dieses Netzes geht über diesen Uplink hinaus. Netze legen Sie unter FTN → Netze & Adressen an."
admin.binkp_uplinks.poll_interval_override_seconds: "Eigenes Pollintervall (Sekunden)"
admin.binkp_uplinks.still_meaningful_when_crash_only: "Auch bei \"Nur Crash\" unten sinnvoll: ein langsamer Rückfall-Poll, denn ein Nur-Crash-Uplink wird sonst nur angewählt, wenn wirklich Post zu senden ist."
admin.binkp_uplinks.this_is_one_of_our: "Das ist einer unserer eigenen Nodes/Points (wir sind sein Hub) -- steht unter \"Nodes / Points\" statt unter \"Hubs\". Mit einer Point-Adresse (21:3/194.1) gilt er als Point: er bekommt nur an ihn gerichtete Netmail und die Bereiche, die er bestellt hat."
admin.binkp_uplinks.post_as_bbs_user_for: "Als BBS-Benutzer schreiben (für Ihre eigene Reader-App)"
admin.binkp_uplinks.empty_an_ordinary_point: "(leer: ein gewöhnlicher Point)"
admin.binkp_uplinks.for_a_reader_like_fidomail: "Für einen Reader wie FidoMail, den Sie als diesen Point nutzen: seine Echomail und Netmail gehen hinaus, als hätte dieser Benutzer sie auf der BBS geschrieben -- mit Adresse, MSGID und Origin-Zeile dieses Systems -- und Netmail an diesen Benutzer wird auch an den Point kopiert (beim Einrichten die der letzten zwei Wochen). Geben Sie jeder Point-Adresse eines Netzes einen eigenen Eintrag, alle mit demselben Host-Namen, Passwort und Benutzer."
admin.binkp_uplinks.crash_only_exclude_from_the: "Nur Crash: nicht im regelmässigen Poll des Mailers -- aber sofort angewählt, sobald Netmail oder Echomail für ihn wartet (Crash-Auslösung des Mailers), dazu das Pollintervall oben als langsamer Rückfall, falls gesetzt, oder von Hand mit \"Jetzt senden\""
admin.binkp_uplinks.hold_never_dialed_automatically_for: "Hold: nie automatisch angewählt, auch nicht bei wartender Crash-Post -- nur mit \"Jetzt senden\" oder wenn dieser Uplink uns selbst pollt. Für eine Gegenstelle, die man nicht erreichen kann (z.B. ein Point hinter NAT ohne Portweiterleitung), wo \"Nur Crash\" einen aussichtslosen Anwahlversuch bei jeder wartenden Post nicht verhindert."
admin.binkp_uplinks.no_cram_md5_send_the: "Kein CRAM-MD5: das Sitzungspasswort im Klartext senden, auch wenn dieser Uplink CRAM-MD5 anbietet. Nur zur Fehlersuche bei einem Hub -- jeder auf dem Weg kann das Passwort lesen. Sonst ausgeschaltet lassen."
admin.binkp_uplinks.restrict_to_these_of_your: "Auf diese Ihrer Adressen beschränken"
admin.binkp_uplinks.only_checked_addresses_are_presented: "Nur angehakte Adressen werden diesem Uplink genannt (M_ADR) und gelten bei der Crash-Zustellung als seine -- damit eine AKA aus einem anderen Netz nicht bei einem Hub landet, der nichts damit zu tun hat (die Software eines Hubs kann für jede Adresse in M_ADR selbst einen neuen Node anlegen). Nichts anhaken behält das alte Verhalten: jede Adresse gilt für jeden Uplink."
admin.binkp_uplinks.no_addresses_configured_yet_add: "Noch keine Adressen eingerichtet -- legen Sie eine unter FTN → Netze & Adressen an."
