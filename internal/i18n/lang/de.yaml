admin.binkp_uplinks.sent_as_the_first_line: "Als erste Zeile jeder Bestellung oder Abbestellung von Echomail-Bereichen an den \"Areafix\"-Roboter dieses Uplinks gesendet -- die Abos verwalten Sie auf der Seite Areafix / Filefix."
