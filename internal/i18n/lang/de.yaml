admin.binkp_uplinks.sent_as_the_first_line_2: "Als erste Zeile jeder Bestellung oder Abbestellung von File-Echos an den \"Filefix\"-Roboter dieses Uplinks gesendet -- oft ein anderes Passwort als für Areafix."
admin.binkp_uplinks.none_never_carries_outgoing_echomail: "— keines (trägt nie ausgehende Echomail) —"
