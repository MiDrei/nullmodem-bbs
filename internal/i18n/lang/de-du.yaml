admin.offsite.your_private_key_shown_only: "Dein privater Schlüssel -- nur jetzt gezeigt. Ohne ihn kann niemand die Kopien öffnen. Bewahr ihn im Passwort-Manager oder auf Papier auf, nicht auf diesem Server."
