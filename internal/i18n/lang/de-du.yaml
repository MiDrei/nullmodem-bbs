admin.offsite.make_a_new_login_key: "Einen neuen Login-Schlüssel erzeugen? Der alte gilt nicht mehr, sobald du ihn auf dem Server ersetzt."
admin.offsite.each_backup_also_goes_to: "Jedes Backup geht auch an einen Speicherdienst (S3, OpenStack Swift, SFTP oder WebDAV) -- vorher mit deinem Schlüssel verschlüsselt, sodass weder der Dienst noch jemand, der an diesen Server kommt, die Kopien dort lesen kann. Nur dein privater Schlüssel öffnet sie."
