admin.twofactor.each_works_once_in_place: "-- jeder ersetzt einmal einen Code, falls dein Handy weg ist. Bewahr sie sicher auf (Passwort-Manager, Papier); sie werden nicht nochmal gezeigt."
admin.twofactor.scan_this_with_your_authenticator: "Scann das mit deiner Authenticator-App (Aegis, Google Authenticator, 1Password, …) und gib dann den angezeigten Code ein."
admin.twofactor.off_with_it_on_signing: "Aus. Eingeschaltet braucht die Anmeldung hier neben dem Passwort einen Code aus einer App auf deinem Handy -- ein gestohlenes Passwort allein reicht dann nicht. Portal, Reader, QWK und die normale Telnet-Anmeldung bleiben, wie sie sind."
