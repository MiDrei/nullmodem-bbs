# Admin
admin.archive.every_inbound_binkp_file_a: "Jede kürzlich per BinkP empfangene Datei (ein Paket, eine TIC-Beschreibung, die Nutzlast eines File-Echos oder etwas Unbekanntes), ein paar Tage aufbewahrt, egal ob das Tossen geklappt hat -- zum Untersuchen von Unklarem und um es bei Bedarf erneut zu tossen. Wähl eine TIC-Beschreibung zusammen mit ihrer Nutzlast, um beide als Paar erneut zu tossen, so wie in ihrer ursprünglichen Sitzung."
admin.areafix.no_binkp_uplinks_configured_yet: "Noch keine BinkP-Uplinks eingerichtet -- leg zuerst einen an auf der"
admin.areafix.request_echomail_areafix_or_file_2: "Echomail- (Areafix) oder File-Echo-Bereiche (Filefix) bei einem eingerichteten Uplink bestellen. Jede Bestellung wird als Netmail mit Crash-Priorität eingereiht und innerhalb weniger Minuten über den üblichen Crash-Auslöser des Mailers gesendet, nicht sofort -- die Antwort (angenommen, abgelehnt oder ein Passwortfehler) kommt als gewöhnliche Netmail zurück. Die Bereichsliste eines Hubs in Kästchen umzuwandeln klappt nicht immer: jede Hub-Software formatiert sie anders, prüf also bei Ungereimtheiten den Rohtext der Antwort unten und trag fehlende Tags von Hand ein."
admin.areafix.a_downlink_authenticated_with_the: "Ein Downlink mit dem richtigen Areafix/Filefix-Passwort kann trotzdem nichts bestellen, was hier nicht angehakt ist -- gib nur frei, was dieser Downlink wirklich bestellen soll. Ein Häkchen zu entfernen bestellt nichts ab, was schon freigegeben ist; der Bereich ist nur ab jetzt nicht mehr bestellbar."
admin.areafix.no_area_list_reply_on: "Für die Adresse dieses Uplinks liegt noch keine Bereichsliste vor -- klick oben auf \"Bereichsliste anfordern\", warte, bis sie ankommt, dann \"Antwort aktualisieren\". Tags kannst du unten inzwischen von Hand eintragen."
admin.backups.the_backups_are_on_the: "Die Backups liegen auf derselben Platte wie die BBS: sie helfen gegen Fehler und eine kaputte Datenbank, nicht gegen eine kaputte Platte oder einen verlorenen Server. Dafür schaltest du unten die Kopie ausser Haus ein -- verschlüsselt, nach S3, OpenStack Swift, SFTP oder WebDAV."
admin.binkp.networks_and_your_addresses: "Netze und deine Adressen"
admin.binkp.the_ftn_networks_you_belong: "Die FTN-Netze, zu denen du gehörst, und deine Node-Adresse in jedem. Unter dem Namen werden ein Uplink und seine Bereiche gruppiert (Tabs im Admin und Portal, Trenner in den Telnet-Bereichslisten); die Domain wird an deine Adresse angehängt ("
admin.binkp.your_address: "Deine Adresse"
admin.binkp.their_domain_matches_none_of: "Ihre Domain passt zu keinem der Netze oben. Leg das Netz an oder entferne die Adresse."
admin.binkp.remove_v_and_your_address: "{V} und deine Adresse(n) darin entfernen?"
admin.binkp_uplinks.enter_a_host_port_first: "Trag zuerst host:port ein."
admin.binkp_uplinks.set_this_system_s_own: "Trag zuerst die eigene FTN-Adresse dieses Systems unter FTN → Netze & Adressen ein."
admin.binkp_uplinks.sent_as_the_first_line: "Als erste Zeile jeder Bestellung oder Abbestellung von Echomail-Bereichen an den \"Areafix\"-Roboter dieses Uplinks gesendet -- die Abos verwaltest du auf der Seite Areafix / Filefix."
admin.binkp_uplinks.locally_posted_echomail_in_this: "Hier geschriebene Echomail in den Bereichen dieses Netzes geht über diesen Uplink hinaus. Netze legst du unter FTN → Netze & Adressen an."
admin.binkp_uplinks.restrict_to_these_of_your: "Auf diese deiner Adressen beschränken"
admin.binkp_uplinks.no_addresses_configured_yet_add: "Noch keine Adressen eingerichtet -- leg eine unter FTN → Netze & Adressen an."
admin.chat.talk_with_the_callers_on: "Mit den Anrufern über Telnet und SSH plaudern -- und über einen verbundenen Raum mit Discord und Matrix. Wer dich ruft, wartet in seinem eigenen Raum -- du bekommst eine Benachrichtigung, und er steht hier oben."
admin.chat.waiting_for_you: "wartet auf dich"
admin.chat.username_paged_you_text: "{USERNAME} ruft dich: {TEXT}"
admin.dashboard.v_is_paging_you_answer: "{V} ruft dich -- im Chat antworten →"
admin.designer.select_the_text_tool_and: "Wähl zuerst das Text-Werkzeug und klick in eine Zelle."
admin.designer.clipboard_is_empty_select_a: "Die Zwischenablage ist leer. Markier zuerst einen Bereich und kopier ihn."
admin.designer.selected_code_currentchar_click_a: "Gewählt: Code {CURRENTCHAR}. Klick unten ein Zeichen an, um es zu ändern, dann zeichne mit Stift, Text, Linie, Rechteck oder Rahmen."
admin.doors.the_door_runs_on_another: "Die Door läuft auf einem anderen System -- einem Door-Netz wie DoorParty oder einer anderen BBS -- und wird über RLogin erreicht. Das Netz nennt dir den Host und was als die zwei Benutzernamen gesendet wird (oft ein System-Kürzel vor dem Namen des Anrufers und das Passwort deines Systems)."
admin.doors.no_doors_yet_add_one: "Noch keine Doors — füg unten eine aus einer Vorlage hinzu."
admin.doors.the_others_you_unpack_there: "; die anderen packst du dort selbst aus."
admin.doors.what_the_multi_relay_chat: "Was das Multi-Relay-Chat-Netz über dein Board zeigt. Pipe-Farbcodes ("
admin.doors.installing_starts_the_chat_connection: "Das Installieren startet die Chat-Verbindung (umrc-bridge) sofort. Pro Board ist nur eine Verbindung erlaubt; lass MRC für dieses Board also nirgends sonst laufen."
admin.languages.the_bbs_speaks_v_a: "Die BBS spricht {V}; ein Anrufer wählt seine Sprache bei der Registrierung und im Profil. Ändere hier jeden Text -- was du leer lässt, bleibt wie mitgeliefert, und Englisch springt ein, wo einer Sprache etwas fehlt. Auch Screens kann es pro Sprache geben:"
admin.languages.changed_by_you: "Von dir geändert"
admin.login.the_code_from_your_authenticator: "Der Code aus deiner Authenticator-App -- oder einer deiner Wiederherstellungscodes."
admin.maintenance.cleans_up_old_echomail_files: "Räumt alte Echomail, Dateien und gelesene Netmail, das Log, BinkP-Protokolle und das Eingangsarchiv auf und verdichtet danach die Datenbank. Nie gelöscht: deine noch nicht an den Hub gesendeten Beiträge, ungelesene oder ungesendete Netmail und Nachrichten jünger als 14 Tage."
admin.maintenance.preview_and_run_now_use: "Vorschau und Jetzt starten nehmen die gespeicherten Grenzen — speichere Änderungen zuerst."
admin.menus.what_callers_can_do_on: "Was Anrufer über Telnet und SSH tun können. Jeder Punkt hat eine Taste, eine Beschriftung, eine Aktion und den niedrigsten Security Level, der ihn sieht. Ein Menü mit eigenem Screen zeigt diesen statt der erzeugten Liste -- trag neue Punkte dort auch ein (die Vorschau sagt, welche fehlen); einen Screen kann es pro Sprache geben (main.de.ans). Gespeicherte Menüs gelten beim nächsten Menü des Anrufers."
admin.menus.this_version_s_stock_name: "Das mitgelieferte {NAME}-Menü dieser Version hat, was deines nicht hat:"
admin.menus.pressing_it_only_gets_unknown: "Drücken bringt nur \"Unbekannter Befehl.\" -- füg den Punkt hinzu oder nimm ihn vom Screen."
admin.pending_areas.areas_the_binkp_tosser_auto: "Bereiche, die der BinkP-Tosser für ein unbekanntes Echo selbst angelegt hat. Sie bleiben überall in der BBS unsichtbar -- auch in den normalen Listen der Nachrichten- und Dateibereiche --, bis du sie hier prüfst und freigibst. Pass Name, Beschreibung, Gruppe und Security Levels vor der Freigabe an; das Tag selbst steht fest (es muss dem AREA-/Echo-Tag des Netzes entsprechen)."
admin.polls.ask_your_callers_something_they: "Frag deine Anrufer etwas -- sie stimmen über Telnet (V) oder im Portal (Community) ab, jeder einmal, und dürfen es sich anders überlegen. Darunter die BBS-Liste, die sie pflegen."
admin.security.addresses_that_keep_failing_to: "Adressen, die sich wiederholt nicht anmelden können -- über Telnet, SSH, das Portal oder hier --, werden eine Weile gesperrt, jedes Mal länger. Neue Konten können auf deine Freischaltung warten, bevor sie schreiben."
admin.security.you_re_connected_from: "Du bist verbunden von"
admin.security.so_you_can_never_lock: "damit du dich nie selbst aussperrst (lohnt sich bei einer festen Adresse)."
admin.security.sysop_accounts_without_it_can: "Sysop-Konten ohne sie kommen nicht mehr hinein. Schalte deine eigene zuerst ein{V}."
admin.security.they_read_and_write_netmail: "Sie lesen und schreiben dir Netmail."
admin.settings.boards_of_a_network_post: "Die Boards eines Netzes schreiben bei jedem Abmelden eines Anrufers einen Eintrag in ein Daten-Echo und zeigen, wer zuletzt wo war. Markier dieses Echo als Datenbereich (Bereiche → Nachrichtenbereiche), damit es nicht als ungelesen erscheint."
admin.settings.your_address_as_shown: "Deine Adresse, wie angezeigt"
admin.stats.on_the_1st_a_recap: "Am 1. geht ein Rückblick auf den Monat an deine Netmail (Einstellungen → Monatsrückblick)."
admin.users.they_can_read_and_write: "Sie können lesen und dir Netmail schreiben; die Freischaltung gibt ihnen den Level neuer Benutzer und erlaubt Schreiben, Doors und Uploads."
