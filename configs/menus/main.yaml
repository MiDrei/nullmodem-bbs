name: main
title: "{BBSNAME} - Main Menu"
items:
  - key: W
    label: "Who's online"
    action: "builtin:who"
    min_sl: 0
  - key: Y
    label: "Your stats (SL {SL})"
    action: "builtin:stats"
    min_sl: 0
  - key: V
    label: "Version"
    action: "builtin:version"
    min_sl: 0
  - key: S
    label: "Sysop menu"
    action: "goto:sysop"
    min_sl: 200
  - key: Q
    label: "Quit"
    action: "logoff"
    min_sl: 0
