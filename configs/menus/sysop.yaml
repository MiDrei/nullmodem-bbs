name: sysop
title: "Sysop Menu - Node {NODE}"
screen: sysop.ans
items:
  - key: L
    label: "List users"
    action: "builtin:listusers"
    min_sl: 200
  - key: S
    label: "Set user security level"
    action: "builtin:setsl"
    min_sl: 200
  - key: C
    label: "Create message area"
    action: "builtin:createarea"
    min_sl: 200
  - key: F
    label: "Create file area"
    action: "builtin:createfilearea"
    min_sl: 200
  - key: I
    label: "Import file"
    action: "builtin:importfile"
    min_sl: 200
  - key: M
    label: "Back to main menu"
    action: "goto:main"
    min_sl: 0
  - key: Q
    label: "Quit"
    action: "logoff"
    min_sl: 0
